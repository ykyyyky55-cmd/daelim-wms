<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="대림WMS">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="manifest" href="./manifest.json">
    <title>대림오일 스마트 WMS - 클라우드 실시간 재고관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail:', err));
            });
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; transition: background-color 0.2s ease, color 0.2s ease; }
        
        /* 테마별 커스텀 스타일 (Dark / Warm / Light) */
        [data-theme="dark"] body { background-color: #0b0f19; color: #f1f5f9; }
        [data-theme="dark"] header.bg-white,
        [data-theme="dark"] div.bg-white,
        [data-theme="dark"] section div.bg-white { 
            background-color: #131b2e !important; 
            border-color: #1e293b !important; 
            color: #f1f5f9 !important; 
        }
        [data-theme="dark"] .bg-slate-50, 
        [data-theme="dark"] .bg-slate-100 { 
            background-color: #0f172a !important; 
            border-color: #1e293b !important; 
            color: #e2e8f0 !important; 
        }
        [data-theme="dark"] .border-slate-100,
        [data-theme="dark"] .border-slate-200, 
        [data-theme="dark"] .border-slate-300 { 
            border-color: #243048 !important; 
        }
        [data-theme="dark"] .text-slate-900, 
        [data-theme="dark"] .text-slate-800, 
        [data-theme="dark"] .text-slate-700 { 
            color: #f8fafc !important; 
        }
        [data-theme="dark"] .text-slate-600, 
        [data-theme="dark"] .text-slate-500 { 
            color: #94a3b8 !important; 
        }
        [data-theme="dark"] input:not([type="checkbox"]):not([type="radio"]), 
        [data-theme="dark"] select, 
        [data-theme="dark"] textarea { 
            background-color: #1e293b !important; 
            border-color: #334155 !important; 
            color: #f8fafc !important; 
        }
        [data-theme="dark"] tr:hover { 
            background-color: rgba(255, 255, 255, 0.03) !important; 
        }

        /* 눈 편한 모드 (Warm / Eye-Care) */
        [data-theme="warm"] body { background-color: #f6f1e8; color: #2e2924; }
        [data-theme="warm"] header.bg-white,
        [data-theme="warm"] div.bg-white,
        [data-theme="warm"] section div.bg-white { 
            background-color: #fdfbf7 !important; 
            border-color: #e8e0d1 !important; 
            color: #2e2924 !important; 
        }
        [data-theme="warm"] .bg-slate-50, 
        [data-theme="warm"] .bg-slate-100 { 
            background-color: #efe8da !important; 
            border-color: #e2d8c3 !important; 
            color: #423b32 !important; 
        }
        [data-theme="warm"] .border-slate-100,
        [data-theme="warm"] .border-slate-200, 
        [data-theme="warm"] .border-slate-300 { 
            border-color: #e5dbc8 !important; 
        }
        [data-theme="warm"] input:not([type="checkbox"]):not([type="radio"]), 
        [data-theme="warm"] select, 
        [data-theme="warm"] textarea { 
            background-color: #fffefb !important; 
            border-color: #d8cdb8 !important; 
            color: #2e2924 !important; 
        }

        @media print {
            html, body {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
            }
            header, #header-container, #modals-container, .no-print, .hidden, .hidden * {
                display: none !important;
                visibility: hidden !important;
            }
            body * {
                visibility: hidden;
            }
            .printable-area, .printable-area * {
                visibility: visible;
            }
            .printable-area {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 210mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                border: none !important;
                box-shadow: none !important;
            }
            .a4-page-3120, .a4-page-3130 {
                box-shadow: none !important;
                border: none !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                margin: 0 !important;
            }
        }

        /* 폼텍(Formtec) A4 대량 인쇄 전용 스타일 */
        @page { 
            size: A4 portrait; 
            margin: 0 !important; 
        }
        
        .formtec-page {
            width: 210mm;
            height: 297mm;
            box-sizing: border-box;
            background: white !important;
            color: black !important;
            overflow: hidden;
            page-break-after: always;
            margin: 0;
            padding: 0;
        }
        
        .formtec-page:last-child { 
            page-break-after: auto; 
        }
        
        .fmt-grid { 
            display: grid; 
            box-sizing: border-box; 
        }
        
        /* 폼텍 3102 (2칸: 199.6 x 143.5 mm - 200L 드럼 / 파레트용) */
        .fmt-3102 {
            padding-top: 5.0mm;
            padding-left: 5.2mm;
            padding-right: 5.2mm;
            grid-template-columns: 199.6mm;
            grid-auto-rows: 143.5mm;
            row-gap: 0;
        }

        /* 폼텍 3105 (4칸: 99.1 x 139.0 mm - 20L 페일 / 말통용) */
        .fmt-3105 {
            padding-top: 9.5mm;
            padding-left: 4.7mm;
            padding-right: 4.7mm;
            grid-template-columns: repeat(2, 99.1mm);
            grid-auto-rows: 139.0mm;
            column-gap: 2.4mm;
            row-gap: 0;
        }

        /* 폼텍 3107 (6칸: 99.1 x 93.1 mm - 중형 포장 / 오일박스용) */
        .fmt-3107 {
            padding-top: 8.9mm;
            padding-left: 4.7mm;
            padding-right: 4.7mm;
            grid-template-columns: repeat(2, 99.1mm);
            grid-auto-rows: 93.1mm;
            column-gap: 2.4mm;
            row-gap: 0;
        }

        /* 폼텍 3108 (8칸: 99.1 x 67.7 mm - 물류 출하 박스용) */
        .fmt-3108 {
            padding-top: 13.1mm;
            padding-left: 4.7mm;
            padding-right: 4.7mm;
            grid-template-columns: repeat(2, 99.1mm);
            grid-auto-rows: 67.7mm;
            column-gap: 2.4mm;
            row-gap: 0;
        }

        /* 폼텍 3120 & 3114 (14칸: 99.1 x 38.1 mm) */
        .fmt-3120 { 
            padding-top: 15.2mm;
            padding-left: 4.7mm;
            padding-right: 4.7mm;
            grid-template-columns: repeat(2, 99.1mm); 
            grid-auto-rows: 38.1mm; 
            column-gap: 2.4mm; 
            row-gap: 0; 
        }
        
        /* 폼텍 3118 (18칸: 63.5 x 46.6 mm) */
        .fmt-3118 { 
            padding-top: 8.7mm;
            padding-left: 7.2mm;
            padding-right: 7.2mm;
            grid-template-columns: repeat(3, 63.5mm); 
            grid-auto-rows: 46.6mm; 
            column-gap: 2.5mm; 
            row-gap: 0; 
        }

        /* 폼텍 3130 (24칸: 64.0 x 33.8 mm - 소형 캔 / 샘플병용) */
        .fmt-3130 {
            padding-top: 13.3mm;
            padding-left: 4.5mm;
            padding-right: 4.5mm;
            grid-template-columns: repeat(3, 64.0mm);
            grid-auto-rows: 33.8mm;
            column-gap: 4.5mm;
            row-gap: 0;
        }

        /* 감열식 롤 라벨 (100 x 80 mm 롤 프린터 1매 규격) */
        .roll-10080 {
            width: 100mm;
            min-height: 80mm;
            padding: 4mm;
            box-sizing: border-box;
            background: white !important;
            color: black !important;
            page-break-after: always;
            margin: 0 auto;
        }

        /* 폼텍 3130 (A4 1분할 전면 라벨: 200mm x 287mm - 파렛트 식별표 규격) */
        .a4-page-3130 {
            width: 210mm;
            min-height: 297mm;
            box-sizing: border-box;
            background: white !important;
            color: black !important;
            margin: 0 auto;
            padding: 5mm;
            position: relative;
        }
        
        .fmt-cell { 
            box-sizing: border-box; 
            padding: 4mm; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            overflow: hidden; 
            background: white !important;
        }

        /* ==========================================================================
           대림오일 공식 Formtec 3120 라벨 규격 (A4 1장에 2칸 대형 200mm x 138mm)
           ========================================================================== */
        .a4-page-3120 {
            width: 210mm !important;
            height: 297mm !important;
            max-height: 297mm !important;
            padding-top: 8.5mm !important;
            padding-left: 5mm !important;
            box-sizing: border-box !important;
            background: #ffffff !important;
            color: #000000 !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 2mm !important;
            page-break-after: always !important;
            page-break-inside: avoid !important;
            margin: 0 auto !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 2px;
            overflow: hidden !important;
        }

        .label-card-3120 {
            width: 200mm !important;
            height: 138mm !important;
            max-height: 138mm !important;
            border: 2px solid #000000 !important;
            background: #ffffff !important;
            color: #000000 !important;
            box-sizing: border-box !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
            position: relative !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        .label-title-3120 {
            width: 100% !important;
            height: 110px !important;
            min-height: 110px !important;
            max-height: 110px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            font-size: 52px;
            font-weight: 800 !important;
            padding: 0 10px !important;
            border-bottom: 2px solid #000000 !important;
            letter-spacing: 1px;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            color: #000000 !important;
            background: #ffffff !important;
            box-sizing: border-box !important;
        }

        .label-table-3120 {
            width: 100% !important;
            height: calc(100% - 110px) !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #ffffff !important;
        }

        .label-table-3120 th, 
        .label-table-3120 td {
            border-bottom: 2px solid #000000 !important;
            padding: 4px 6px !important;
            vertical-align: middle !important;
            box-sizing: border-box !important;
            background: #ffffff !important;
            color: #000000 !important;
        }

        .label-table-3120 th {
            width: 28% !important;
            font-size: 38px;
            font-weight: 800 !important;
            text-align: center !important;
            border-right: 2px solid #000000 !important;
            background-color: #ffffff !important;
            letter-spacing: 1px;
            color: #000000 !important;
        }

        .label-table-3120 td {
            width: 72% !important;
            font-size: 44px;
            font-weight: 800 !important;
            text-align: center !important;
            color: #000000 !important;
            letter-spacing: 0.5px;
            position: relative !important;
        }

        .label-table-3120 tr:last-child th,
        .label-table-3120 tr:last-child td {
            border-bottom: none !important;
        }

        .lot-td-container-3120 {
            position: relative !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 55px !important;
        }

        .stamp-box-inline-3120 {
            position: absolute !important;
            right: 15px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: 78px !important;
            height: 78px !important;
            border: 2px solid #e11d48 !important;
            border-radius: 50% !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            background: #ffffff !important;
            line-height: 1.1 !important;
            box-sizing: border-box !important;
            padding: 2px !important;
            z-index: 5 !important;
        }

        .stamp-company-3120 {
            font-size: 10px !important;
            font-weight: bold !important;
            color: #000000 !important;
            border-bottom: 1px solid #000000 !important;
            padding-bottom: 2px !important;
            margin-bottom: 2px !important;
            width: 88% !important;
            text-align: center !important;
            white-space: nowrap !important;
            letter-spacing: -0.5px !important;
        }

        .stamp-date-3120 {
            font-size: 12px !important;
            font-weight: bold !important;
            color: #000000 !important;
            margin: 1px 0 !important;
            letter-spacing: -0.5px !important;
            white-space: nowrap !important;
        }

        .stamp-pass-3120 {
            font-size: 10px !important;
            font-weight: bold !important;
            color: #e11d48 !important;
            letter-spacing: 1px !important;
            white-space: nowrap !important;
        }
    </style>
  <script type="module" crossorigin src="./assets/index-DBPDRVKq.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col antialiased">
