<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>국내건_카밈(예시) 폼텍 3130 100% 원본 일치화 템플릿</title>
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #475569;
    display: flex;
    justify-content: center;
    padding: 20px;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
  }
  /* A4 용지 규격: 210mm x 297mm */
  .a4-page {
    width: 210mm;
    height: 297mm;
    background: #ffffff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    position: relative;
    padding: 7.7mm 6.9mm; /* DGF 외곽선 위치: Left 6.92mm, Top 7.70mm */
  }
  @media print {
    body { background: none; padding: 0; }
    .a4-page { box-shadow: none; width: 210mm; height: 297mm; page-break-after: always; }
  }

  /* 가장 바깥 테두리선 */
  .outer-border {
    width: 196.5mm;
    height: 279.3mm;
    border: 2px solid #000000;
    display: flex;
    flex-direction: column;
    padding: 5mm;
    gap: 5mm;
  }

  /* 최상단: 파렛트 식별표 박스 */
  .title-box {
    height: 34.4mm;
    border: 2px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #ffffff;
  }
  .title-text {
    font-size: 50pt;
    font-weight: 900;
    letter-spacing: 4px;
    color: #000000;
  }
  .qr-tag {
    position: absolute;
    left: 4mm;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 본문 대형 테이블 박스 */
  .body-box {
    flex: 1;
    border: 2px solid #000000;
    display: flex;
    flex-direction: column;
  }

  /* 1. 제품명 */
  .section-product {
    height: 35mm;
    border-bottom: 2px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2mm 5mm;
    text-align: center;
  }
  .product-text {
    font-size: 35pt;
    font-weight: 900;
    line-height: 1.15;
    word-break: keep-all;
    color: #000000;
  }

  /* 2. PALLET NO. */
  .section-pallet {
    height: 52mm;
    border-bottom: 2px solid #000000;
    background-color: #d9d9d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .pallet-label {
    font-size: 20pt;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 2mm;
    color: #000000;
  }
  .pallet-number {
    font-size: 70pt;
    font-weight: 900;
    line-height: 1;
    color: #000000;
    letter-spacing: 4px;
  }

  /* 3. 공급업체 */
  .section-supplier {
    height: 30mm;
    border-bottom: 2px solid #000000;
    display: flex;
    flex-direction: column;
  }
  .supplier-header {
    height: 11mm;
    border-bottom: 1.5px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18pt;
    font-weight: 900;
    background: #ffffff;
    color: #000000;
    letter-spacing: 2px;
  }
  .supplier-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20pt;
    font-weight: 900;
    color: #000000;
  }

  /* 4. 제품정보 (LOT, 생산일자, 수량) */
  .section-info {
    border-bottom: 2px solid #000000;
    display: flex;
    flex-direction: column;
  }
  .info-header {
    height: 11mm;
    border-bottom: 1.5px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18pt;
    font-weight: 900;
    background: #ffffff;
    color: #000000;
    letter-spacing: 2px;
  }
  .info-table {
    width: 100%;
    border-collapse: collapse;
  }
  .info-table tr {
    height: 13.5mm;
    border-bottom: 1.5px solid #000000;
  }
  .info-table tr:last-child {
    border-bottom: none;
  }
  .info-table th {
    width: 32%;
    border-right: 1.5px solid #000000;
    font-size: 20pt;
    font-weight: 900;
    text-align: center;
    color: #000000;
    padding: 0 4mm;
  }
  .info-table td {
    width: 68%;
    font-size: 20pt;
    font-weight: 900;
    text-align: center;
    color: #000000;
    padding: 0 4mm;
  }

  /* 5. 납품처 */
  .section-customer {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .customer-header {
    height: 11mm;
    border-bottom: 1.5px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18pt;
    font-weight: 900;
    background: #ffffff;
    color: #000000;
    letter-spacing: 2px;
  }
  .customer-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20pt;
    font-weight: 900;
    color: #000000;
  }
</style>
</head>
<body>

<div class="a4-page">
  <div class="outer-border">
    <!-- 최상단 타이틀 박스 -->
    <div class="title-box">
      <div class="title-text">파렛트 식별표</div>
    </div>

    <!-- 본문 대형 테이블 -->
    <div class="body-box">
      <!-- 제품명 -->
      <div class="section-product">
        <div class="product-text">카밈 가솔린 촉매 산소센서 클리너 프로 0.3L</div>
      </div>

      <!-- PALLET NO. (회색 배경) -->
      <div class="section-pallet">
        <div class="pallet-label">PALLET NO.</div>
        <div class="pallet-number">1/3</div>
      </div>

      <!-- 공급업체 -->
      <div class="section-supplier">
        <div class="supplier-header">공급업체</div>
        <div class="supplier-body">대림기업</div>
      </div>

      <!-- 제품정보 (LOT NO, 생산일자, 수량) -->
      <div class="section-info">
        <div class="info-header">제품정보</div>
        <table class="info-table">
          <tr>
            <th>LOT NO.</th>
            <td>260914</td>
          </tr>
          <tr>
            <th>생산일자.</th>
            <td>260917</td>
          </tr>
          <tr>
            <th>수 &nbsp; &nbsp; 량.</th>
            <td>60박스(1800개)</td>
          </tr>
        </table>
      </div>

      <!-- 납품처 -->
      <div class="section-customer">
        <div class="customer-header">납품처</div>
        <div class="customer-body">에이치엘비글로벌(주)</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
